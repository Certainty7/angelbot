name: checks

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly dependency audit (advisory): an upstream CVE must not freeze a hotfix.
    - cron: "17 4 * * 1"

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Fixture owner id: the self-test must never read a real one.
      ANGEL_OWNER_ID: "42"
      PYTHONPATH: "."
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      # actions/setup-python v5.6.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system and Python dependencies
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pip install -r requirements.txt pytest ruff

      - name: Compile
        run: python -m compileall -q bot.py angel cogs tools tests

      - name: Lint changed files (advisory)
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- '*.py')
          else
            files=$(git diff --name-only HEAD~1 -- '*.py' || true)
          fi
          if [ -n "$files" ]; then printf '%s\n' "$files" | xargs -r -d '\n' ruff check; else echo "no changed Python files"; fi

      - name: Pytest
        run: python -m pytest -q

      - name: Deploy gate (offline)
        run: python tools/selftest.py

      - name: Adversarial security probe
        run: python tools/security_probe.py

      - name: Arabic recall probe
        run: python tools/recall_probe.py

  dependency-audit:
    # Advisory and scheduled only; never blocks a PR hotfix.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: pip-audit (advisory)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  website-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-python v5.6.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Catalogue and invite data
        run: python tests/website/test_command_catalog.py

      - name: Generated data is committed
        run: python tools/website-data-generator/generate.py --check

  website-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-node v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build the static site
        run: bash website/scripts/build.sh

      - name: Upload the build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: website-dist
          path: website/dist
          retention-days: 7
