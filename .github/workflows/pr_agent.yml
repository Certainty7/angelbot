name: PR-Agent (disabled)

# Audit finding 09: this workflow used `the-pr-agent/pr-agent@main`, and that action builds a
# rolling runtime image, so an upstream change or compromise could read the write-capable
# GITHUB_TOKEN and the Gemini key without a commit here.
#
# Re-enabling requires, in one reviewed change:
#   1. a full 40-character commit SHA for the action, approved by the owner in the PR;
#   2. a digest-pinned runtime image (a `docker://…@sha256:…` step) instead of a rolling tag;
#   3. the automatic triggers restored deliberately, not by copying this stub back.
#
# `tests/test_ops_and_gates.py::WorkflowPinningTest` fails on any mutable `uses:` ref, so an
# unpinned re-enable cannot merge.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "PR-Agent is disabled pending an immutable action ref and runtime digest."
