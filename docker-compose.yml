services:
  angelbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: angelbot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ANGEL_DB_PATH=/app/data/angel.db
      - PYTHONUNBUFFERED=1
    volumes:
      - angel_data:/app/data
    # The image ships code and dependencies; the runtime filesystem stays read-only and
    # only the named volume plus a small /tmp are writable.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  angel_data:
